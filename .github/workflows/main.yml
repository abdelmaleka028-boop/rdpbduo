name: Kali-RDP
on:
  workflow_dispatch:

jobs:
  kali-rdp:
    runs-on: ubuntu-latest
    timeout-minutes: 3600

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap xrdp xfce4 xfce4-goodies dbus-x11 curl

      - name: Create Kali rootfs
        run: |
          sudo debootstrap kali-rolling /kali http://http.kali.org/kali
          echo "root:toor" | sudo chroot /kali chpasswd
          sudo chroot /kali apt-get update
          sudo chroot /kali apt-get install -y kali-linux-default

      - name: Start xrdp inside Kali
        run: |
          sudo cp /etc/xrdp/* /kali/etc/xrdp/ -r
          sudo chroot /kali systemctl enable xrdp || true
          sudo chroot /kali service xrdp start || true

      - name: Install Tailscale
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo tailscale up --authkey ${TAILSCALE_AUTH_KEY} --hostname=kali-runner-${GITHUB_RUN_ID} --ssh
          IP=$(tailscale ip -4)
          echo "TAILSCALE_IP=$IP" >> $GITHUB_ENV

      - name: Print Connection Info
        run: |
          echo "===================="
          echo "Kali RDP Ready!"
          echo "IP: ${{ env.TAILSCALE_IP }}"
          echo "User: root"
          echo "Pass: toor"
          echo "Port: 3389"
          echo "===================="

      - name: Keep Alive
        run: |
          while true; do
            echo "RDP active..."
            sleep 300
          done
